[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wedding-transcriptor"
version = "0.1.0"
description = "Local transcription client for live wedding events"
requires-python = ">=3.12"
dependencies = [
    # Audio capture
    "sounddevice>=0.4.7",
    "numpy>=1.26",
    # VAD — Silero VAD requires PyTorch
    "silero-vad>=5.1",
    "torch>=2.2",
    # Transcription — mlx-whisper (Apple Silicon GPU) on macOS,
    # faster-whisper (CPU) everywhere else
    "mlx-whisper>=0.4.3; sys_platform == 'darwin'",
    "faster-whisper>=1.0; sys_platform != 'darwin'",
    # Networking
    "websockets>=14.0",
    "httpx>=0.27",
    # Configuration
    "pydantic-settings[yaml]>=2.3",
    "PyYAML>=6.0",
]

[project.scripts]
transcriptor = "transcriptor.main:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/transcriptor"]

[tool.hatch.envs.default]
python = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
log_level = "WARNING"
