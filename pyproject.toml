[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wedding-transcriptor"
version = "0.1.0"
description = "Local transcription client for live wedding events"
requires-python = ">=3.12"
dependencies = [
    # Audio capture
    "sounddevice>=0.4.7",
    "numpy>=1.26",
    # VAD — Silero VAD requires PyTorch
    "silero-vad>=5.1",
    "torch>=2.2",
    # Transcription
    "faster-whisper>=1.0",
    # Networking
    "websockets>=12.0",
    "httpx>=0.27",
    # Configuration
    "pydantic-settings[yaml]>=2.3",
    "PyYAML>=6.0",
]

[project.scripts]
transcriptor = "transcriptor.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/transcriptor"]

[tool.hatch.envs.default]
python = "3.12"
