event_id: wedding-2027
api_key: your-secret-api-key # can be overriden by $API_KEY

server:
  host: wedding-translator-production.up.railway.app
  # host: localhost:3000

audio:
  device_id: default

transcription:
  model: mlx-community/whisper-medium
  language: en
  initial_prompts:
    cs: "Toto je přepis svatebního proslovu. Ženich Jáchym a nevěsta Sophie, rodina, přátelé, svědci, svatba na zámku Chateau de Vaugrenier, gratulace, přípitek, láska, štěstí, novomanželé."
    en: "This is a transcript of a wedding speech. Groom Jáchym and bride Sophie, family, friends, witnesses, wedding at Chateau de Vaugrenier, congratulations, toast, love, happiness, newlyweds."
    fr: "Ceci est la transcription d'un discours de mariage. Le marié Jáchym et la mariée Sophie, la famille, les amis, les témoins, le mariage au Château de Vaugrenier, les félicitations, le toast, l'amour, le bonheur, les jeunes mariés."
    pl: "To jest transkrypcja przemówienia weselnego. Pan młody Jáchym i panna młoda Sophie, rodzina, przyjaciele, świadkowie, ślub na zamku Chateau de Vaugrenier, gratulacje, toast, miłość, szczęście, nowożeńcy."

stabilization:
  silence_ms: 300
  stable_ms: 1500

vad:
  max_speech_ms: 2000
  end_overlap_ms: 300
  start_overlap_ms: 600
  overrides:
    cs:
      max_speech_ms: 4000
      end_overlap_ms: 500
      start_overlap_ms: 1500
